services:
  # "app" automatically becomes network alias
  app-backend:
    container_name: fastapi-app
    env_file:
      - .env
    # image: cmolloy36/tutoring-tracker:latest
    build:
      dockerfile: Dockerfile.fastapi
    command: [ "sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --reload" ] # TODO: consider using fastapi command
    ports:
      - "8000:8000"
    working_dir: /app
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres-db:
        condition: service_healthy # makes sure db is connected before webapp starts.
    environment:
      DATABASE_PASSWORD: /run/secrets/db_password
      DATABASE_HOSTNAME: postgres-db
    networks:
      - app_network

  streamlit-app:
    container_name: streamlit-app
    env_file:
      - .env
    build:
      dockerfile: Dockerfile.streamlit
    command: [ "streamlit", "run", "streamlit-app/streamlit_app.py" ]
    ports:
      - "8501:8501"
    networks:
      - app_network

  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: /run/secrets/db_password
    ports:
      - "${DATABASE_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres-data:
